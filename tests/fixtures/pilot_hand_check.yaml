# The pilot world: Pilot_Spec.md v0.4 (decisions 0003, 0004 and 0006).
# Fields the pilot spec does not set are left to the schema defaults.
recipe_version: 1

terrain:
  map_type: spine_island
  size_preset: hand_check

layers:
  dual_membership: false            # ruling A4
  power:
    state: emitted
    sources: [osm_power, wri_gppd]  # ruling A3: deliberate source disagreement
  telecom:
    state: emitted
    sources: [osm_telecom]
  water:
    state: emitted
    sources: [osm_water]
  transport:
    state: emitted
    sources: [osm_transport, ourairports]  # decision 0006: OpenStreetMap backbone, OurAirports crossing it
  fuel:
    state: emitted
    sources: [osm_fuel]
  healthcare:
    state: emitted
    sources: [osm_health, facility_register]  # ruling A3: deliberate source disagreement

shared_causes:
  hazards:
    storm_corridor:
      switched_on: true
  scenarios: 8

unobserved:
  crews: 2                          # ruling A2

dynamics:
  tier: exact

errors:
  default_mechanism: parametric

answer_key_requests:
  - model: protect_condition_and_add_reserve
    member_class: defensive
    budget_cost_units: 3
    service_weights: lifeline
    objective: unserved_demand_hours
  - model: protect_condition_and_add_reserve
    member_class: defensive
    budget_cost_units: 4
    service_weights: lifeline
    objective: unserved_demand_hours
  - model: strike_nodes
    member_class: offensive
    strikes_k: 2
    service_weights: lifeline
    objective: unserved_demand_hours
  - model: strike_nodes
    member_class: offensive
    strikes_k: 3
    service_weights: lifeline
    objective: unserved_demand_hours
  - model: sequence_repair_crews
    member_class: restorative
    service_weights: lifeline
    objective: unserved_demand_hours
  - model: observe_uncertain_couplings
    member_class: informative
    observations_n: 1
    service_weights: lifeline
    objective: unserved_demand_hours
