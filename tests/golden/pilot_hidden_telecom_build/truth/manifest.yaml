    - circuits
    - cables
    - the remaining tags
  wri_gppd:
    scored:
    - latitude
    - longitude
    - capacity_mw
    - primary_fuel
    context:
    - name
    - gppd_idnr
    - country
    - country_long
    - the empty columns
  ourairports:
    scored:
    - latitude_deg
    - longitude_deg
    - type
    - scheduled_service
    context:
    - name
    - ident
    - iso_country
    - iso_region
    - municipality
    - continent
  facility_register:
    scored:
    - location (地址)
    - class
    - level (特約類別; which list)
    - beds (急性病床數)
    context:
    - name
    - institution code
    - county and district
    - departments
    - the other columns
declared_departures:
- 'Facility register: latitude and longitude stand in the address column (E5); addresses, a gazetteer and the geocoder come in Phase 6.'
- Names are in English only (E4); bilingual names come later.
- Footprints are axis-aligned rectangles centred on the true location (E2).
- PBF blobs are stored uncompressed, which the format allows, so the file is identical on every platform (A5); Geofabrik's extracts are compressed.
- 'Facility register coordinates are at 6 decimals, a choice: the real files carry addresses, so there is no precision to measure (§4.1a).'
- 'Columns the world does not hold are left empty: WRI''s commissioning_year and owner (Phase 6 draws them at fill rates measured from the real file; structure v0.11 §4.6).'
- 'Overpass: TWN_Hospital, TWN_Industrial and TWN_Telecom_OSM_Overpass are inferred from landed tags, query text not saved; they are replaced when the pipeline supplies the text.'
- The institution register's file is named in ASCII; the real one is named in Chinese.
- 'Source overlap (assets missing from one of two sources) is Phase 3: in Phase 1 every true element in a source''s scope appears in it.'
- 'Error settings recorded, not applied (Phase 1: zero-error emission): facility_register, osm_fuel, osm_health, osm_power, osm_transport, osm_water, ourairports, wri_gppd.'
