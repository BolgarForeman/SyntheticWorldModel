name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run pytest

      # Work Order 8, A5: the pilot's extract opens in osmium. The golden PBF is the built one
      # (the identity test above proves it), so osmium reads it straight from the repository.
      - name: Open the pilot extract in osmium
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium fileinfo -e tests/golden/pilot_build/sources/osm/island.osm.pbf
