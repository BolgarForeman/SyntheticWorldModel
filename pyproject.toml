[project]
name = "swm"
version = "0.0.0"
description = "Constructed-world generator: synthetic interdependent infrastructure worlds, their source files, truth manifest and answer keys."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0,<3",
    "pyproj>=3.8.0",
    "pyyaml>=6.0",
]

[project.scripts]
swm = "swm.cli:main"

[project.optional-dependencies]
preview = [
    "matplotlib>=3.11.2",
]
export = [
    "pyogrio>=0.13.0",
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8 naming
    "D",    # docstrings (CLAUDE.md §6)
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "DTZ",  # naive datetimes
    "ERA",  # commented-out code (CLAUDE.md §6)
    "T20",  # print debugging (CLAUDE.md §6)
    "TID",  # banned APIs (CLAUDE.md §4)
    "PTH",  # pathlib for every path (CLAUDE.md §4)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "All randomness comes from the spawn tree (CLAUDE.md §4)."
"numpy.random.seed".msg = "No global RNG; use the spawn tree (CLAUDE.md §4)."
"uuid".msg = "UUIDs make output irreproducible (CLAUDE.md §4)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# rasterio and pyogrio ship no type information; they are used only by the optional export.
module = ["rasterio", "rasterio.*", "pyogrio", "pyogrio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--cov=swm", "--cov-report=term-missing", "-m", "not slow"]
markers = [
    "slow: the full answer-key re-solve; run with -m slow on any change to dynamics/, solve/ or a dynamics rule (Work Order 10, E6 as amended)",
    "keys: the byte-exact re-score of every answer key; CI runs it as its own job, without coverage tracing",
]

[tool.coverage.run]
branch = true
source = ["swm"]

[tool.coverage.report]
# CHOICE: enforce the CLAUDE.md §7 coverage target in CI rather than leave it advisory.
fail_under = 90
