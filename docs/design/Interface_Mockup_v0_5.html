<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>World Generator — interface mockup v0.5</title>
<!-- Standalone export of docs/design/Interface_Mockup_v0_5.dc.html. The template and its logic are unchanged;
     a small bundled runtime renders them in any browser. Reference only: it builds no world. -->
<style>
/* Keep the side columns at their design widths; the middle column scrolls if its content is wider. */
nav[aria-label="Generator steps"]{flex-shrink:0}
main{min-width:0;overflow:auto}
</style>
</head>
<body style="margin:0;background:#F4F1EA">
<div id="dc-root"></div>
<template id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#F4F1EA;color:#1C1B19}
a{color:#1F5F5B}a:hover{color:#133D3A}
input[type=range]{accent-color:#1F5F5B;width:100%}
input[type=checkbox]{accent-color:#1F5F5B;width:18px;height:18px;margin:0}
button{font-family:inherit}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:8px;border:1px solid #8A8377;color:#5E5A52;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;cursor:help;flex-shrink:0;margin-left:6px}
.tip:hover{background:#1F5F5B;border-color:#1F5F5B;color:#FFFFFF}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1B19">

<header style="height: 72px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #DDD7CB; background: #FBFAF6">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">World Generator</div>
<div style="font-size: 13px; color: #5E5A52">Constructed-world recipe builder · mockup v0.5 · hover any <span style="font-family: 'IBM Plex Mono', monospace">i</span> for an explanation</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #DDD7CB; border-radius: 8px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">
<span style="color: #5E5A52">root seed</span><span>{{rootSeed}}</span><span class="tip" tabindex="0" title="{{tips.rootSeed}}" aria-label="{{tips.rootSeed}}">i</span>
</div>
<button type="button" onClick="{{saveRecipe}}" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #1F5F5B; background: #FFFFFF; color: #1F5F5B; font-size: 14px; font-weight: 600; cursor: pointer">{{saveLabel}}</button>
<button type="button" onClick="{{generate}}" style="height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #1F5F5B; background: #1F5F5B; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Generate world</button>
</header>

<div style="flex-grow: 1; display: flex; min-height: 0">

<nav aria-label="Generator steps" style="width: 236px; box-sizing: border-box; padding: 14px 14px; border-right: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 3px; background: #F4F1EA">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="10">
<button type="button" onClick="{{st.pick}}" style="min-height: 48px; padding: 5px 12px; border-radius: 8px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; {{st.style}}">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: 'IBM Plex Mono', monospace; {{st.badge}}">{{st.n}}</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; font-weight: 600">{{st.label}}</span>
<span style="font-size: 12px; color: #5E5A52">{{st.sub}}</span>
</span>
</button>
</sc-for>
<div style="margin-top: auto; padding: 12px; border-radius: 8px; background: #EFEBE2; font-size: 12px; color: #3F3B34; display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Three kinds of quantity</span>
<span><span style="font-weight: 600; color: #1F5F5B">Observed</span>: emitted to sources, with source error.</span>
<span><span style="font-weight: 600; color: #B4531A">Unobserved</span>: real in the world, never emitted.</span>
<span><span style="font-weight: 600">Rules</span>: the world's own dynamics.</span>
</div>
</nav>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{isTerrain}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px">Terrain</h1>
<p style="margin: 0; font-size: 14px; color: #5E5A52">The ground everything is sited on. Synthetic coordinates only, not registered to any real place.</p>
</div>
<div style="display: flex; gap: 22px; align-items: flex-start">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5E5A52">Map type<span class="tip" tabindex="0" title="{{tips.mapType}}" aria-label="{{tips.mapType}}">i</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="11">
<button type="button" onClick="{{p.pick}}" title="{{p.desc}}" style="min-height: 52px; padding: 8px 10px; border-radius: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; {{p.style}}">
<span style="font-size: 14px; font-weight: 600; color: #1C1B19">{{p.name}}</span>
<span style="font-size: 11px; color: #5E5A52">{{p.desc}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid #DDD7CB; border-radius: 10px; background: #FFFFFF">
<div style="display: flex; align-items: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5E5A52">Character<span class="tip" tabindex="0" title="{{tips.character}}" aria-label="{{tips.character}}">i</span></div>
<div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) 40px; gap: 8px 14px; align-items: center">
<sc-for list="{{chars}}" as="c" hint-placeholder-count="8">
<label for="ch-{{c.key}}" title="{{c.tip}}" style="font-size: 14px; display: flex; align-items: center">{{c.name}}<span class="tip" tabindex="0" title="{{c.tip}}" aria-label="{{c.tip}}">i</span></label><input id="ch-{{c.key}}" type="range" min="{{c.min}}" max="{{c.max}}" value="{{c.value}}" onChange="{{c.set}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: right">{{c.value}}</span>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 14px; display: flex; align-items: center; margin-right: 6px">Urban pattern<span class="tip" tabindex="0" title="{{tips.urbanPattern}}" aria-label="{{tips.urbanPattern}}">i</span></span>
<sc-for list="{{urbanPatterns}}" as="u" hint-placeholder-count="3">
<button type="button" onClick="{{u.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #1C1B19; {{u.style}}">{{u.name}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5E5A52">Size preset<span class="tip" tabindex="0" title="{{tips.size}}" aria-label="{{tips.size}}">i</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="5">
<button type="button" onClick="{{z.pick}}" style="min-height: 64px; padding: 8px 10px; border-radius: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; {{z.style}}">
<span style="font-size: 14px; font-weight: 600; color: #1C1B19">{{z.name}}</span>
<span style="font-size: 11px; color: #5E5A52">{{z.desc}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #DDD7CB; border-radius: 10px; background: #FFFFFF; flex-wrap: wrap">
<label for="area" style="font-size: 14px; font-weight: 600; display: flex; align-items: center">Map area (km²)<span class="tip" tabindex="0" title="{{tips.area}}" aria-label="{{tips.area}}">i</span></label>
<input id="area" type="number" min="1" value="{{area}}" onChange="{{setArea}}" style="width: 150px; height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid #DDD7CB; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
<span style="font-size: 13px; color: #5E5A52">When area changes, hold</span>
<sc-for list="{{holdModes}}" as="h" hint-placeholder-count="2">
<button type="button" onClick="{{h.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #1C1B19; {{h.style}}">{{h.name}}</button>
</sc-for>
</div>
<sc-if value="{{simOnly}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #B4531A">At this size the exact optimum is out of reach: simulation tier only, and it should run on Strabo.</div></sc-if>
</div>
</div>
<div style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
<div style="border: 1px solid #DDD7CB; border-radius: 10px; overflow: hidden">
<svg viewBox="0 0 400 300" width="420" height="315" role="img" aria-label="Terrain preview">
<rect x="0" y="0" width="400" height="300" fill="{{map.sea}}"></rect>
<sc-for list="{{map.lands}}" as="l" hint-placeholder-count="3"><path d="{{l.d}}" fill="{{map.land}}" stroke="#A89D82" stroke-width="1.2"></path></sc-for>
<sc-for list="{{map.wet}}" as="w" hint-placeholder-count="4"><circle cx="{{w.x}}" cy="{{w.y}}" r="{{w.r}}" fill="#9FB9A8" opacity="0.55"></circle></sc-for>
<sc-for list="{{map.forest}}" as="f" hint-placeholder-count="10"><circle cx="{{f.x}}" cy="{{f.y}}" r="{{f.r}}" fill="#6F8F5E" opacity="0.45"></circle></sc-for>
<sc-for list="{{map.ridges}}" as="r" hint-placeholder-count="2"><path d="{{r.d}}" fill="none" stroke="#7D6B4C" stroke-width="{{map.ridgeW}}" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"></path></sc-for>
<sc-for list="{{map.rivers}}" as="rv" hint-placeholder-count="4"><path d="{{rv.d}}" fill="none" stroke="#4F87A0" stroke-width="1.6" stroke-linecap="round" opacity="0.85"></path></sc-for>
<sc-for list="{{map.lakes}}" as="lk" hint-placeholder-count="1"><ellipse cx="{{lk.x}}" cy="{{lk.y}}" rx="{{lk.rx}}" ry="{{lk.ry}}" fill="#8FB4C4" stroke="#6E9AAE" stroke-width="1"></ellipse></sc-for>
<sc-for list="{{map.towns}}" as="t" hint-placeholder-count="6"><circle cx="{{t.x}}" cy="{{t.y}}" r="{{t.r}}" fill="#3F3B34" opacity="0.8"></circle></sc-for>
<rect x="8" y="276" width="170" height="18" rx="4" fill="#FFFFFF" opacity="0.85"></rect>
<text x="14" y="289" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1C1B19">seed {{terrainSeed}} · {{areaLabel}}</text>
</svg>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<label for="tseed" style="font-size: 14px; font-weight: 600; display: flex; align-items: center">Terrain seed<span class="tip" tabindex="0" title="{{tips.terrainSeed}}" aria-label="{{tips.terrainSeed}}">i</span></label>
<input id="tseed" type="number" value="{{terrainSeed}}" onChange="{{setTerrainSeed}}" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #DDD7CB; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; background: #FFFFFF">
<button type="button" onClick="{{reroll}}" aria-label="Reroll terrain seed" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #DDD7CB; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="9" cy="9" r="1.2" fill="#1C1B19"></circle><circle cx="15" cy="15" r="1.2" fill="#1C1B19"></circle><circle cx="15" cy="9" r="1.2" fill="#1C1B19"></circle><circle cx="9" cy="15" r="1.2" fill="#1C1B19"></circle></svg>
</button>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #5E5A52">
<span><span style="color: #7D6B4C; font-weight: 700">—</span> ridges</span><span><span style="color: #4F87A0; font-weight: 700">—</span> rivers</span><span><span style="color: #6F8F5E; font-weight: 700">●</span> forest</span><span><span style="color: #9FB9A8; font-weight: 700">●</span> wetland</span><span><span style="color: #3F3B34; font-weight: 700">●</span> towns</span>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isLayers}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px">Layers and sources</h1>
<p style="margin: 0; font-size: 14px; color: #5E5A52">Each source emits files in its real structure, the same files the real ingestion reads. Nodes and density are one equation over the map area ({{areaLabel}}); change either and the other follows.</p>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid #DDD7CB; border-radius: 10px; background: #FFFFFF">
<input type="checkbox" id="dual" checked="{{dualMembership}}" onChange="{{toggleDual}}">
<label for="dual" style="font-size: 14px; display: flex; align-items: center">Allow assets that belong to two layers, such as a hydro dam that is both water and power<span class="tip" tabindex="0" title="{{tips.dual}}" aria-label="{{tips.dual}}">i</span></label>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{layers}}" as="ly" hint-placeholder-count="6">
<div style="padding: 16px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 11px; {{ly.cardStyle}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 17px; font-weight: 600; flex-grow: 1">{{ly.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5A52">{{ly.count}}</span>
</div>
<div role="group" aria-label="{{ly.name}} state" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ly.modes}}" as="md" hint-placeholder-count="3">
<button type="button" onClick="{{md.pick}}" title="{{md.tip}}" style="min-height: 38px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #1C1B19; {{md.style}}">{{md.name}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #F7F5EF">
<label for="n-{{ly.key}}" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #3F3B34">Nodes
<input id="n-{{ly.key}}" type="number" min="1" value="{{ly.nodes}}" onChange="{{ly.setNodes}}" style="height: 36px; box-sizing: border-box; padding: 0 8px; border: 1px solid #DDD7CB; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px"></label>
<label for="den-{{ly.key}}" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #3F3B34">Per 1,000 km²
<input id="den-{{ly.key}}" type="number" min="0" step="0.1" value="{{ly.density}}" onChange="{{ly.setDensity}}" style="height: 36px; box-sizing: border-box; padding: 0 8px; border: 1px solid #DDD7CB; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px"></label>
<label for="d-{{ly.key}}" style="grid-column: 1 / span 2; display: grid; grid-template-columns: 110px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 12px; color: #3F3B34">Links per node
<input id="d-{{ly.key}}" type="range" min="10" max="40" value="{{ly.deg10}}" onChange="{{ly.setDeg}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: right">{{ly.degLabel}}</span></label>
</div>
<div style="font-size: 12px; color: #5E5A52">Node classes: {{ly.classes}}</div>
<div style="display: flex; align-items: flex-start; gap: 10px">
<input type="checkbox" id="no-{{ly.key}}" checked="{{ly.nodeOnly}}" onChange="{{ly.toggleNodeOnly}}" style="margin-top: 2px">
<label for="no-{{ly.key}}" style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Sources report nodes only</span><span style="font-size: 12px; color: #5E5A52">{{ly.linkLine}}</span></label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #EFEBE2; padding-top: 10px">
<sc-for list="{{ly.sources}}" as="src" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; min-height: 30px">
<input type="checkbox" id="src-{{src.key}}" checked="{{src.on}}" onChange="{{src.toggle}}">
<label for="src-{{src.key}}" style="font-size: 14px; flex-grow: 1">{{src.name}}</label>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 7px; border-radius: 5px; background: #EFEBE2; color: #3F3B34">{{src.format}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{ly.overlap}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: #E3EEEC">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 140px 44px; gap: 10px; align-items: center">
<label for="ov-{{ly.key}}" style="font-size: 13px; font-weight: 600; color: #1F5F5B; display: flex; align-items: center">Assets in more than one source<span class="tip" tabindex="0" title="{{tips.overlap}}" aria-label="{{tips.overlap}}">i</span></label>
<input id="ov-{{ly.key}}" type="range" min="0" max="100" value="{{ly.overlapPct}}" onChange="{{ly.setOverlap}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: right">{{ly.overlapPct}}%</span>
</div>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isCouplings}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px">Couplings and shared causes</h1>
<p style="margin: 0; font-size: 14px; color: #5E5A52">Which layers depend on which, how they are wired, and what makes failures arrive together. Click a cell to switch that coupling on or off.</p>
</div>
<div style="display: flex; gap: 22px; align-items: flex-start">
<div style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 16px; border: 1px solid #DDD7CB; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5E5A52">Row supplies column<span class="tip" tabindex="0" title="{{tips.matrix}}" aria-label="{{tips.matrix}}">i</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<span></span>
<sc-for list="{{matrixHead}}" as="h" hint-placeholder-count="6"><span style="font-size: 12px; font-weight: 600; text-align: center; padding: 4px 0">{{h}}</span></sc-for>
<sc-for list="{{matrix}}" as="cell" hint-placeholder-count="42">
<sc-if value="{{cell.isLabel}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; padding: 12px 0 12px 4px">{{cell.t}}</span></sc-if>
<sc-if value="{{cell.isDiag}}" hint-placeholder-val="{{ false }}"><span style="text-align: center; padding: 12px 0; color: #C9C2B2">·</span></sc-if>
<sc-if value="{{cell.isCell}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{cell.toggle}}" aria-label="{{cell.label}}" title="{{cell.label}}" style="min-height: 44px; border-radius: 6px; cursor: pointer; font-size: 14px; {{cell.style}}">{{cell.t}}</button></sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #5E5A52">
<span><span style="color: #1F5F5B; font-weight: 700">●</span> on ({{couplingsOn}})</span>
<span><span style="color: #B4531A; font-weight: 700">○</span> off, generated and hidden ({{couplingsHidden}})</span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{resetCouplings}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDD7CB; background: #FFFFFF; cursor: pointer; font-size: 13px">Reset to the 21 modeled</button>
<button type="button" onClick="{{allCouplings}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDD7CB; background: #FFFFFF; cursor: pointer; font-size: 13px">All on</button>
</div>
</div>

<div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5E5A52; display: flex; align-items: center">Drawn per element, from context<span class="tip" tabindex="0" title="{{tips.drawn}}" aria-label="{{tips.drawn}}">i</span></div>

<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {

    this.state = {
      step: 1, preset: 'spine', terrainSeed: 48213,
      chars: { mountains: 60, forest: 35, rivers: 40, urban: 45, coast: 50, wetland: 20, aridity: 20, islands: 2 },
      urbanPattern: 'several', size: 'hand', area: 400, holdMode: 'density', dualMembership: true,
      layers: {

        water: lay(4, 1.6, false, { osm_water: true, dam_register: false }),

        fuel: lay(4, 1.4, true, { osm_fuel: true, osm_pipelines: false, lng_register: false }),
        healthcare: lay(4, 1.2, true, { osm_health: true, healthsites: false, facility_register: true })
      },
      couplings: null, couplingDensity: 50, hideExcluded: true, twoWay: true,
      notNearest: 25, concentration: 40, feeds: { single: 60, full: 25, half: 15 }, scenarios: 8,
      hazards: { storm: { on: true, corr: 40 }, seismic: { on: false, corr: 60 }, flood: { on: false, corr: 20 } },
      drawn: { reserves: { het: 50, gap: 30 }, requirement: { het: 40, gap: 0 }, repair: { het: 45, gap: 20 }, failmode: { het: 30, gap: 0 }, hiddenlinks: { het: 35, gap: 0 } },
      crews: 6, depots: 2, tier: 'exact', windowH: 72, redundancy: 40, severity: 60,
      mechanism: 'parametric', errSel: 'osm_power', errBySource: {},
      members: 1, vary: { terrain: false, infrastructure: false, unobserved: false, errors: true },
      req: { cls: 'D', model: 0, objective: 'j1', weights: 'health', budget: 3 },
      requests: [{ cls: 'D', model: 0, objective: 'j1', weights: 'health', budget: 3 }, { cls: 'O', model: 0, objective: 'j1', weights: 'equal', budget: 2 }],
      generated: false, saved: false, recipeMode: 'readable', copied: false
    };
  }
  renderVals() {
    const s = this.state;
    const dirty = { generated: false, saved: false };
    const set = (k) => (e) => this.setState({ [k]: Number(e.target.value), ...dirty });
    const selStyle = (on) => on ? 'border: 2px solid #1F5F5B; background: #E3EEEC' : 'border: 2px solid #DDD7CB; background: #FFFFFF';
    const tips = {
      rootSeed: 'One number that, with the recipe, rebuilds this exact world. Every stage draws from its own child stream of it, so changing one thing never moves anything else.',
      mapType: 'The overall shape of the land. It decides where the coast is, how far the interior is from the sea, and where ports and airports can go.',
      character: 'What the land is like. These drive where each layer can site its assets, and how exposed they are to each hazard.',
      urbanPattern: 'One dominant city, several cities, or dispersed towns. The pattern shapes how assets cluster and how far supply has to travel.',
      size: 'A starting point that sets the map area and every layer’s node count together. Adjust any of them afterward.',
      area: 'Map area in square kilometres. Node counts and densities are tied to it: nodes = area × density.',
      terrainSeed: 'Changes the ground only. Infrastructure and errors keep their own streams.',
      dual: 'Some real assets sit in two layers at once. A hydro dam stores water and generates power; losing it hits both.',
      overlap: 'How many true assets appear in more than one source. Each copy differs a little, as real sources do; the true match-up between them is the answer key for combining sources.',
      matrix: 'Each cell says whether the row layer supplies the column layer. Healthcare is the pure sink: it consumes from all five and supplies none.',
      hide: 'A coupling switched off can still exist in the true world, just outside what the analysis is told about. Its true effect is known, so the cost of leaving it out is measured.',
      cden: 'How many cross-layer dependencies each consumer has.',
      notNearest: 'How often a consumer’s true supplier is not its nearest one. At zero, a pipeline that guesses couplings by distance is always right, and there is no doubt to carry.',
      concentration: 'How concentrated dependencies are: spread across many suppliers, or a few suppliers carrying most consumers. Hubs follow from this; the truth manifest flags every one.',
      feeds: 'How consumers are fed. The three always total 100%. Two full feeds and two half feeds carry the same total supply and fail completely differently.',
      hazards: 'Shared fields that make failures arrive together. Correlation length is how far apart two assets can be and still tend to fail together.',
      scenarios: 'How many disruption scenarios are drawn from the active hazard fields.',
      derived: 'Computed from what the generator built, so they stay consistent with the rest of the world. A hospital on a direct transmission line gets a strong coupling because of the line, not because a number was drawn.',
      drawn: 'Drawn for each element from its context: its class, where it sits, how it is fed, how old it is. The target is what a standard or code says; the truth varies around it.',
      hetero: 'How strongly context drives the value. At zero, every element of a class gets the same value.',
      gap: 'How far practice falls short of the design target. At zero, everything meets code.',
      tier: 'The world’s own rules. Exact uses restricted rules so the optimum is provable; simulation runs the full rules; both runs worlds small enough for either, so the two can be compared.',
      transfer: 'How a node’s function responds when its supply drops, chosen per dependency type from the four canon forms.',
      redundancy: 'How much spare capacity is built into the world overall.',
      severity: 'How hard the hazards hit.',
      mechanism: 'The process that produces the errors, not what gets corrupted. Structured, realistic error is what makes later tests meaningful.',
      attrs: 'Only the few attributes the pipeline actually reads are scored. The rest are emitted, because real sources carry them, but errors on them do not count.',
      coverage: 'A source that only lists plants above a size cutoff, or maps half the region, is missing assets systematically. That is different from scattered omissions.',
      age: 'Old sources carry retired units and superseded capacities.',
      rates: 'Each rate is the share of true elements in this source’s scope that get this corruption, counted against the true world, so a source missing things cannot look cleaner.',
      request: 'A question posed of the world: which member-class, which model, which objective, which weights, what budget. Its answer key is stamped with all of it.',
      weights: 'How much keeping each kind of node running counts. A value choice, not a fact about the world, so it belongs to the question, not the world.'
    };

    const stepDefs = [
      [1, 'Terrain', 'Shape, character, size'], [2, 'Layers and sources', 'Counts, states, real structures'],
      [3, 'Couplings and causes', 'Wiring and shared causes'], [4, 'What sources don’t show', 'Derived and drawn'],
      [5, 'Dynamics and difficulty', 'The world’s rules'], [6, 'Error induction', 'Per source'],
      [7, 'Ensembles', 'Later'], [8, 'Generate and review', 'Outputs and world checks'], [9, 'Answer keys', 'Questions posed of the world'], [10, 'Recipe', 'The full record']

    const steps = stepDefs.map(([n, label, sub]) => ({
      n, label, sub, pick: () => this.setState({ step: n }),
      style: s.step === n ? 'border: 1px solid #1F5F5B; background: #FFFFFF; color: #1C1B19' : 'border: 1px solid transparent; background: transparent; color: #1C1B19',
      badge: s.step === n ? 'background: #1F5F5B; color: #FFFFFF' : 'background: #E6E1D6; color: #3F3B34'

    const presetDefs = [
      ['spine', 'Spine island', 'Central range, coastal plain'], ['archipelago', 'Archipelago', 'Many small islands'],
      ['continent', 'Continent', 'Large landmass, far interior'], ['coastal', 'Coastal strip', 'Ridge inland, one coast'],
      ['delta', 'River delta', 'Low, braided rivers'], ['twin', 'Twin islands', 'Two islands, undersea links'],
      ['mainland', 'Mainland + islands', 'Coast with offshore islands'], ['peninsula', 'Peninsula', 'Land reaching into the sea'],

      ['landlocked', 'Landlocked', 'No sea: air and road only']
    ];
    const presets = presetDefs.map(([id, name, desc]) => ({ name, desc, pick: () => this.setState({ preset: id, ...dirty }), style: selStyle(s.preset === id) }));
    const charDefs = [
      ['mountains', 'Mountainous', 0, 100, 'How much of the land is high and steep. Ridges become chokepoints for roads, lines and pipes.'],
      ['forest', 'Forested', 0, 100, 'Forest cover. Slows repair access and raises storm damage to overhead lines.'],
      ['rivers', 'River density', 0, 100, 'How many rivers cross the land. Drives water siting, crossings and flood exposure.'],
      ['urban', 'Urban density', 0, 100, 'How much land is built up. Observed in real land-cover data, so it can drive siting without becoming a demand field.'],
      ['coast', 'Coastline complexity', 0, 100, 'Smooth coast to one full of harbours and inlets. Drives where ports and fuel import terminals can go.'],
      ['wetland', 'Lowland and wetland', 0, 100, 'Share of low, wet ground. Drives flood exposure.'],
      ['aridity', 'Aridity', 0, 100, 'How dry the land is. Drives reservoirs versus groundwater versus desalination.'],

    return fresh;
  }
  function patchChildren(liveParent, freshKids) {
    const live = Array.from(liveParent.childNodes);
    freshKids.forEach((f, i) => {
      const l = live[i];
      if (!l) { liveParent.appendChild(adopt(f)); return; }
      if (l.nodeType !== f.nodeType || (l.nodeType === 1 && (l.localName !== f.localName || l.namespaceURI !== f.namespaceURI))) {
        liveParent.replaceChild(adopt(f), l); return;
      }
      if (l.nodeType === 3) { if (l.data !== f.data) l.data = f.data; return; }
      patchAttrs(l, f); applyProps(l, f);
      patchChildren(l, Array.from(f.childNodes));
    });
    for (let i = freshKids.length; i < live.length; i++) liveParent.removeChild(live[i]);
  }

  function mount() {
    const src = document.getElementById('dc-template');
    // Template content is inert, so the raw {{…}} attributes are never validated as live SVG.
    const tpl = src.content;
    const helmet = tpl.querySelector('helmet');
    if (helmet) { Array.from(helmet.childNodes).forEach((n) => document.head.appendChild(n)); helmet.remove(); }
    const code = document.getElementById('dc-logic').textContent;
    const Component = new Function('DCLogic', code + '\n;return Component;')(DCLogic);
    const comp = new Component({});
    const root = document.getElementById('dc-root');
    let pending = false;
    comp.__render = () => {
      if (pending) return; pending = true;
      Promise.resolve().then(() => {
        pending = false;
        const scope = comp.renderVals();
        const fresh = [];
        tpl.childNodes.forEach((c) => buildNode(c, scope, fresh));
        patchChildren(root, fresh);
      });
    };
    comp.__render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>
</body>
