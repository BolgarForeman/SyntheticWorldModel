    quote: K zt = (1 + K1K2K3)^2 ... (2.8) 式中，K1、K2 與 K3 分別依表 2.3(a)、2.3(b)與 2.3(c)決定。, verified: true}
  - {citation: '建築物耐風設計規範及解說 §2.6, conditions', url: 'https://windexpert.ce.tku.edu.tw/newcode/Dfiles/New_wind_code.pdf',
    quote: 若此獨立山丘、山脊或懸崖高度 H 較上風側 3.22 公里內地形高度超過兩倍以上，且 H 大於 4.5 公尺（地況 C）或 18 公尺（地況 A 或 B），且此獨立山丘、山脊或懸崖在上風側
      100H 或 3.22 公里（兩者取小值）內沒有類似高度之障礙物，且 H/Lh ≧ 0.2, verified: true}
  - {citation: '建築物耐風設計規範及解說 Tables 2.3(a)-(c) (K1, K2, K3); commentary C2.9 K2 = (1 - |x| / (mu Lh)),
      C2.10 K3 = exp(-gamma z / Lh)', url: 'https://windexpert.ce.tku.edu.tw/newcode/Dfiles/New_wind_code.pdf',
    quote: 表 2.3(a) 計算 Kzt 所用之 K1 值 ... 0.20 0.26 0.15 0.19 0.29 0.17 0.21, verified: true}
  - {citation: Work Order 6c and structure v0.8 (decision 0013), url: docs/work_orders/WO-06c.md, quote: null,
    verified: null}
  - {citation: PR 14 answers (decision 0013 addendum), url: docs/work_orders/WO-06c-answers.md, quote: null,
    verified: null}
  reasoning: On the upper half of an isolated hill, ridge or escarpment the wind speeds up. Kzt multiplies
    wind pressure, so the wind speed takes sqrt(Kzt) = 1 + K1 K2 K3. K1 comes from Table 2.3(a) by the
    feature's H/Lh (capped at 0.5) and terrain class; K2 decays with distance x from the crest, 1 - |x|
    / (mu Lh), as Table 2.3(b) tabulates; K3 decays with height z above ground, from Table 2.3(c) (it
    needs exp otherwise). Above H/Lh 0.5, K2 and K3 use Lh = 2H. Applied only where the code's conditions
    hold. The factor is S; its use on power lines is J. The storm reads the factor in its own wind direction
    (storm.rotation); the isolation check reaches min(100H, 3.22 km) upwind of the crest (PR 14 answers,
    decision 0013 addendum).
