- id: draws.lever_meaning
  title: What heterogeneity and the compliance gap mean
  stage: draws
  value: 'heterogeneity: standard deviation as a percent of the target; compliance gap: shifts the median
    below the target (positive) or above it (negative), capped at 95'
  units: null
  applies_to: {layer: null, node_class: null, condition: null}
  grade: J
  jurisdiction: null
  sources:
  - {citation: Structure v0.6 §4.4 (levers); ruling T9, url: docs/design/evidence/Design_Targets_Ruling_Sheet_v0_2.md,
    quote: null, verified: null}
  reasoning: A gap of 0 means centred on the target, not that every element complies. Total absence of
    backup is carried by presence attributes, not by a gap of 100.
  status: ruled
