theta:
- theta_id: theta.minimum_rule
  domain: truth
  sub_type: dynamics
  symbol: F
  chosen: A node's supply level is the lowest of its responses across the commodities it needs (typed
    weakest link), and its state is its condition times its supply level.
  alternatives: [the product of the responses]
  registry_ids: []
  carried_vs_flattened: keeps
  sensitivity: none planned
  ruling:
    by: the author (Foreman)
    date: '2026-10-09'
    decision: '0014'
- theta_id: theta.transfer_forms
  domain: truth
  sub_type: dynamics
  symbol: g_δ
  chosen: Physical flow and service edges deliver linearly; logistic and control edges deliver at the
    threshold θ.
  alternatives: [the step form, concave forms]
  registry_ids: [dynamics.threshold]
  carried_vs_flattened: keeps
  sensitivity: none planned
  ruling:
    by: the author (Foreman)
    date: '2026-10-09'
    decision: '0014'
- theta_id: theta.recovery_form
  domain: truth
  sub_type: dynamics
  symbol: R
  chosen: 'Recovery is all or nothing: a damaged element is off from the storm until its repair completes,
    then fully back.'
  alternatives: [piecewise recovery, gradual recovery]
  registry_ids: []
  carried_vs_flattened: keeps
  sensitivity: none planned
  ruling:
    by: the author (Foreman)
    date: '2026-10-09'
    decision: '0014'
- theta_id: theta.pro_rata_sharing
  domain: truth
  sub_type: dynamics
  symbol: g_δ
  chosen: When a supplier is short, its consumers share what it delivers pro rata.
  alternatives: [priority lines first, full support until exhausted]
  registry_ids: []
  carried_vs_flattened: keeps
  sensitivity: none planned
  ruling:
    by: the author (Foreman)
    date: '2026-10-09'
    decision: '0014'
- theta_id: theta.crew_order
  domain: truth
  sub_type: dynamics
  symbol: R
  chosen: 'Crews take jobs in the default order: towered lines and transmission substations, then distribution
    substations and feeds to end uses by Lifeline weight, then everything else; ties go to the shortest
    travel, then the lowest id.'
  alternatives: [the restorative model's optimized order]
  registry_ids: [dynamics.crew_order]
  carried_vs_flattened: keeps
  sensitivity: none planned
  ruling:
    by: the author (Foreman)
    date: '2026-10-09'
    decision: '0014'
- theta_id: theta.time_step_and_settling
  domain: truth
  sub_type: dynamics
  symbol: γ
