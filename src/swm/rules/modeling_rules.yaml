      ridge: [1.0, 0.74, 0.55, 0.41, 0.3, 0.22, 0.17, 0.12, 0.09, 0.07, 0.05, 0.01, 0.0]
      escarpment: [1.0, 0.78, 0.61, 0.47, 0.37, 0.29, 0.22, 0.17, 0.14, 0.11, 0.08, 0.02, 0.0]
      hill: [1.0, 0.67, 0.45, 0.3, 0.2, 0.14, 0.09, 0.06, 0.04, 0.03, 0.02, 0.0, 0.0]
    h_over_lh_min: 0.2
    h_over_lh_cap: 0.5
    upwind_km: 3.22
    min_height_m: {c: 4.5, ab: 18.0}
